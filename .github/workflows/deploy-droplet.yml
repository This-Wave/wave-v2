name: Deploy (DigitalOcean droplet)

# Builds the three images on every push to main, pushes them to GHCR, then has
# the droplet pull and restart. Run it by hand with a `tag` to redeploy or roll
# back to an earlier commit without rebuilding.
#
# Needs (repo Settings → Secrets and variables → Actions):
#   secrets: DROPLET_HOST, DROPLET_SSH_KEY, DROPLET_KNOWN_HOSTS
#   vars:    NEXT_PUBLIC_* and EXPO_PUBLIC_* (baked into the admin and web images)
# Setup: docs/digitalocean-hosting.md

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (a main commit SHA). Empty = build this commit."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  # Two deploys racing on one server would interleave pulls and restarts.
  group: deploy-droplet
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/this-wave

jobs:
  build:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [api, admin, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/droplet/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/wave-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}
            EXPO_PUBLIC_SUPABASE_URL=${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
            EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
            EXPO_PUBLIC_PAYSTACK_PUBLIC_KEY=${{ vars.EXPO_PUBLIC_PAYSTACK_PUBLIC_KEY }}
            EXPO_PUBLIC_TERMS_URL=${{ vars.EXPO_PUBLIC_TERMS_URL }}
            EXPO_PUBLIC_PRIVACY_URL=${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
            EXPO_PUBLIC_SENTRY_DSN=${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
            EXPO_PUBLIC_SUPPORT_EMAIL=${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
            EXPO_PUBLIC_SUPPORT_WHATSAPP=${{ vars.EXPO_PUBLIC_SUPPORT_WHATSAPP }}

  deploy:
    needs: build
    # Runs after a successful build, or on its own when a tag was given.
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tag)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || github.sha }}
      HOST: ${{ secrets.DROPLET_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy compose file, Caddyfile and deploy script
        run: |
          scp deploy/droplet/docker-compose.yml deploy/droplet/Caddyfile deploy/droplet/deploy.sh \
            "deploy@$HOST:/opt/wave/"
          ssh "deploy@$HOST" chmod +x /opt/wave/deploy.sh
      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes over stdin so it never appears in the droplet's process list.
          printf '%s' "$GHCR_TOKEN" | ssh "deploy@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh "deploy@$HOST" "/opt/wave/deploy.sh '$TAG'"
      - name: Health check
        run: |
          API_HOST=$(ssh "deploy@$HOST" "grep -E '^API_HOST=' /opt/wave/.env | cut -d= -f2")
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "https://$API_HOST/health" || echo 000)
            [ "$code" = "200" ] && { echo "API healthy"; exit 0; }
            sleep 10
          done
          echo "API did not return 200 (last: $code)"; exit 1
