name: Uptime

# Why this exists: on 2026-09-23 the API returned 502 on every request for
# hours and it was noticed by chance, in a screenshot. Nothing was watching.
#
# GitHub Actions is the cheap answer rather than the best one: minutes are free
# on a public repo, the alert reaches a phone through the GitHub mobile app, and
# it needs no new vendor and no new dashboard. It checks from GitHub's network,
# not from Ghana, so it answers "is it up" and not "is it fast for a student".
# See docs/monitoring-and-alerts.md for what this does not cover.

on:
  schedule:
    # Every 10 minutes. GitHub runs scheduled workflows on a best-effort basis
    # and skews them under load, so treat the interval as "about" — it is a
    # smoke alarm, not a stopwatch.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Least privilege: the only thing this workflow writes is an issue.
permissions:
  contents: read
  issues: write

concurrency:
  # A slow run must not overlap the next one and file two issues for one outage.
  group: uptime
  cancel-in-progress: false

env:
  # Repository variables, so a URL change needs no commit. Defaults are the
  # current hosts, so the workflow is useful before anyone sets them.
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://wave-api-ei19.onrender.com/health' }}
  WEB_URL: ${{ vars.WEB_URL || 'https://wave-liart-pi.vercel.app' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the API and the web app
        id: probe
        # `|| true` on each curl: a non-2xx must be reported, not abort the
        # step, or the recovery path below never runs.
        run: |
          set -uo pipefail

          probe() {
            local name="$1" url="$2" tries=0 code=000
            # Three attempts: a single failed request is as likely to be a
            # transient blip on GitHub's side as a real outage, and waking this
            # up for one dropped packet is how alerts get ignored.
            while [ $tries -lt 3 ]; do
              code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "$url" || echo 000)
              case "$code" in 2*) break ;; esac
              tries=$((tries + 1))
              sleep 10
            done
            echo "$name|$url|$code"
          }

          {
            probe api "$API_HEALTH_URL"
            probe web "$WEB_URL"
          } > results.txt

          cat results.txt

          FAILED=""
          while IFS='|' read -r name url code; do
            case "$code" in
              2*) ;;
              *) FAILED="${FAILED}- **${name}** \`${code}\` ${url}"$'\n' ;;
            esac
          done < results.txt

          {
            echo "failed<<__EOF__"
            printf '%s' "$FAILED"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Open, update or close the outage issue
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.probe.outputs.failed }}
        with:
          script: |
            const failed = (process.env.FAILED || "").trim();
            const LABEL = "uptime";
            const TITLE = "Uptime: a Wave service is not responding";

            // One issue for the whole outage, reused. A new issue per failed
            // check every ten minutes is how a useful alert becomes noise
            // somebody mutes.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: LABEL,
              per_page: 1,
            });
            const existing = open[0];
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (!failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Recovered — all checks returned 2xx.\n\n${run}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
                core.notice(`Recovered; closed #${existing.number}`);
              }
              return;
            }

            const body = [
              failed,
              "",
              "First steps are in `docs/monitoring-and-alerts.md`.",
              "",
              `Checked from GitHub Actions: ${run}`,
            ].join("\n");

            if (existing) {
              // Still down. A comment rather than a new issue, so the thread is
              // the history of one outage.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing.\n\n${body}`,
              });
              core.setFailed(`Still failing (see #${existing.number})`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: TITLE,
              labels: [LABEL],
              body,
            });
            // Failing the run is the second notification path: GitHub emails the
            // repo owner when a scheduled workflow on the default branch fails.
            core.setFailed(`Opened #${created.data.number}`);
