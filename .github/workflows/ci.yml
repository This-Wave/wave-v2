name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # `npm ci` does not build workspaces, and `@wave/shared`'s package `types`
      # entry points at `dist/index.d.ts`. Without this every consumer fails
      # type-check with TS2307 "Cannot find module '@wave/shared'" — which is
      # exactly what PR #22's CI run hit while passing on developer machines
      # that happened to have a stale `dist/` lying around.
      # `db generate` is the same problem for `@prisma/client`.
      - run: npm run generate --workspace=@wave/db
      - run: npm run build --workspace=@wave/shared
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_KEY }}
          JWT_SECRET: test-secret

  # Admin end-to-end (review 02-qa-engineer, H2). A separate job because it
  # installs a browser and builds the Next app — no reason to pay that on every
  # unit-test run, and a browser download failing should not mask a unit
  # regression.
  e2e-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run generate --workspace=@wave/db
      - run: npm run build --workspace=@wave/shared
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=@wave/admin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/admin/playwright-report/
          retention-days: 7
