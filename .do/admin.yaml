# DigitalOcean App Platform — Wave admin dashboard (production).
# Create:  doctl apps create --spec .do/admin.yaml
# Runbook: docs/digitalocean-hosting.md
#
# Always on rather than a static site: it serves /legal/terms and /legal/privacy,
# which the mobile app links to at sign-up and an app store reviewer fetches on
# a short timeout.
name: wave-admin
region: fra

services:
  - name: admin
    github:
      repo: This-Wave/wave-v2
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    build_command: npm ci --include=dev && npm run build --workspace @wave/shared && npm run build --workspace apps/admin
    run_command: npm start --workspace apps/admin
    http_port: 8080
    health_check:
      http_path: /legal/terms
    envs:
      - key: NODE_ENV
        scope: RUN_AND_BUILD_TIME
        value: production
      # NEXT_PUBLIC_* are inlined at BUILD time. Changing one needs a rebuild
      # (Actions → Force rebuild and deploy); a restart keeps the old value.
      # Full URL with https:// and the /v1 suffix — the client concatenates paths onto it.
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: https://CHANGE-ME.ondigitalocean.app/v1
      - key: NEXT_PUBLIC_SUPABASE_URL
        scope: BUILD_TIME
        type: SECRET
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        scope: BUILD_TIME
        type: SECRET
      - key: NEXT_PUBLIC_SENTRY_DSN
        scope: BUILD_TIME
        type: SECRET
