# Lives on the droplet at /opt/wave/docker-compose.yml, next to .env (secrets,
# never committed), Caddyfile and deploy.sh. The deploy workflow copies this
# file, the Caddyfile and deploy.sh over on every deploy. Run ./deploy.sh rather
# than `docker compose` directly: it sets IMAGE_TAG.
#
# Only `web` (Caddy) publishes ports. Docker's published ports bypass ufw, and
# the API trusts one proxy hop for client IPs, so publishing api or admin would
# expose them directly and let callers spoof their address.
#
# Postgres (`db`) is internal-only — no host ports. Point DATABASE_URL and
# DIRECT_URL at postgresql://wave:${POSTGRES_PASSWORD}@db:5432/wave (no SSL).
# Never remove `db` from this file while production uses it: deploy.sh runs
# `--remove-orphans` and would stop the container (the pgdata volume still keeps
# the files, but the API would lose the hostname).

name: wave

x-logging: &logging
  # The default json-file driver never rotates, and would fill the disk.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Match Neon’s major (currently 18). pg_dump/pg_restore must be ≥ server.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wave
    # Shared 1 GB droplet also runs Wave + crescendo — keep Postgres lean.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
    # PG 18+ images expect the volume at /var/lib/postgresql (not .../data).
    volumes:
      - pgdata:/var/lib/postgresql
    mem_limit: 256m
    shm_size: 64mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave -d wave"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  migrate:
    image: ghcr.io/this-wave/wave-api:${IMAGE_TAG:?run ./deploy.sh <tag>}
    command: ["prisma", "migrate", "deploy", "--schema", "packages/db/prisma/schema.prisma"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  api:
    image: ghcr.io/this-wave/wave-api:${IMAGE_TAG:?run ./deploy.sh <tag>}
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY_HOPS: "1"
      # Node sizes its heap from the host's memory, not what's free. Cap each
      # process so Wave + Postgres + crescendo fit in 1 GB.
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      db:
        condition: service_healthy
      # A failed migration stops here, and the running API is left in place.
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging

  admin:
    image: ghcr.io/this-wave/wave-admin:${IMAGE_TAG:?run ./deploy.sh <tag>}
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=128
    restart: unless-stopped
    logging: *logging

  web:
    image: ghcr.io/this-wave/wave-web:${IMAGE_TAG:?run ./deploy.sh <tag>}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      API_HOST: ${API_HOST:?set API_HOST in .env}
      ADMIN_HOST: ${ADMIN_HOST:?set ADMIN_HOST in .env}
      WEB_HOST: ${WEB_HOST:?set WEB_HOST in .env}
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
      # Old hostnames kept alive during a domain move; leave unset otherwise.
      LEGACY_API_HOST: ${LEGACY_API_HOST:-}
      LEGACY_ADMIN_HOST: ${LEGACY_ADMIN_HOST:-}
      LEGACY_WEB_HOST: ${LEGACY_WEB_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates. Losing this volume means re-issuing every certificate,
      # and Let's Encrypt rate-limits that.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
