#cloud-config
# First-boot setup for the Wave droplet (Ubuntu 24.04). Pass it at creation:
#   doctl compute droplet create ... --user-data-file deploy/droplet/cloud-init.yaml
# Takes a few minutes after the droplet reports active; progress is in
# /var/log/cloud-init-output.log.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  # Security updates install themselves; reboots stay manual.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  - curl -fsSL https://get.docker.com | sh
  # `deploy` runs the containers. Membership of the docker group is root in
  # practice, so its SSH key is the one to guard.
  - useradd --create-home --shell /bin/bash --groups docker deploy
  - install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
  - install -m 600 -o deploy -g deploy /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
  - install -d -o deploy -g deploy /opt/wave
  # Swap so a memory spike slows the box down instead of killing a container.
  # 1 GB: the $4 droplet has only a 10 GB disk.
  - fallocate -l 1G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  # Prefer RAM; only swap under real pressure.
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-swap.conf
  - sysctl --system
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - systemctl restart ssh
